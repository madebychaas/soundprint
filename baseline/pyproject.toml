[project]
name = "soundprint-baseline"
version = "2.0.0"
description = "Soundprint world baseline: ingestion, weighting and comparative distributions"
requires-python = ">=3.10,<3.13"
# Deliberately dependency-free: stdlib csv/json/sqlite3 plus the zstd and tar
# binaries. Keeping this light means building the baseline needs no numeric
# stack and can run anywhere the analyzer can.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soundprint_baseline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
