[project]
name = "soundprint-audio"
version = "0.1.0"
description = "Soundprint objective audio analysis service"
requires-python = ">=3.10,<3.13"
dependencies = [
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "numpy>=1.24,<2.3",
    "scipy>=1.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soundprint_audio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
